name: Spec watch

on:
  schedule:
    - cron: "0 6 1 * *"
  pull_request:
    paths:
      - IAB_Vast_ErrorCodes_EN.json
      - scripts/check_spec.py
      - .github/workflows/spec-watch.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the JSON against the VAST spec
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check_spec.py > report.md 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report drift as an issue
        if: steps.check.outputs.status != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="VAST spec drift detected"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

      - name: Fail when the check reported drift
        if: steps.check.outputs.status != '0'
        run: exit 1
